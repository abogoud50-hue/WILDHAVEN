<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>WILDHAVEN</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="lookZone"></div>
<button id="btnJump" class="btn">قفز</button>
<button id="btnSprint" class="btn">ركض</button>

<div id="hud">
  <select id="quality">
    <option value="low">رسوميات: منخفضة</option>
    <option value="medium">رسوميات: متوسطة</option>
    <option value="high">رسوميات: عالية</option>
  </select>
  <span id="fps"></span>
</div>

<div id="loading">
  <h1>WILDHAVEN</h1>
  <p id="loadMsg">جارٍ تجهيز الجزيرة...</p>
  <button id="startBtn" hidden>ابدأ اللعب</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
