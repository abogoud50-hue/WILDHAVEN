<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>WILDHAVEN</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body class="menu">
<canvas id="c"></canvas>

<div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="lookZone"></div>

<div id="hud"><span id="info"></span><span id="fps"></span></div>
<div id="compass"><canvas id="cmp" width="360" height="34"></canvas></div>
<div id="mapWrap"><canvas id="mini" width="128" height="128"></canvas></div>

<button id="btnCam" class="btn sm">👁</button>
<button id="btnSet" class="btn sm">⚙</button>
<button id="btnSprint" class="btn">ركض</button>
<button id="btnJump" class="btn">قفز</button>
<button id="btnAct" class="btn act"><span id="actLbl">✋</span></button>

<div id="toast"></div>
<div id="settings"><div class="panel"><h2>الإعدادات</h2>
<div class="row"><span>المنظور</span><button id="sView" class="tg">ثالث</button></div>
<div class="row"><span>عرض FPS</span><button id="sFps" class="tg on">تشغيل</button></div>
<div class="row"><span>الصوت</span><input id="sVol" type="range" min="0" max="100"></div>
<div class="row"><span>لعب جماعي (Wi-Fi / نقطة اتصال)</span></div>
<div class="row"><button id="sHost" class="tg">استضافة</button><input id="sCode" inputmode="numeric" maxlength="6" placeholder="رمز الانضمام"><button id="sJoin" class="tg">انضم</button></div>
<small id="sNet"></small>
<div class="row"><button id="sReset" class="tg red">إعادة ضبط اللعبة</button><button id="sClose" class="tg">إغلاق</button></div>
</div></div>
<div id="itemName"></div>
<div id="hotbar"></div>

<div id="loading">
  <div id="menu">
    <div class="brand"><h1>WILDHAVEN</h1><p>بقاء · استكشاف · بناء</p></div>
    <div class="card">
      <div class="qrow"><button class="q" data-q="medium">جودة متوسطة</button><button class="q" data-q="high">جودة عالية</button></div>
      <small>العالية: ظلال ودقة أعلى مع خفض تلقائي للدقة عند الثقل</small>
      <button id="startBtn">ابدأ اللعب</button>
    </div>
  </div>
</div>
<div id="rotate">🔄 أدر الهاتف إلى الوضع الأفقي</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
